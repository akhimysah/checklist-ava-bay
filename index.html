<!doctype html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>AVA Bay Pilotage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&family=Nunito:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6EFE6;--surface:#FFFCF8;--surface-2:#EFE4D6;--line:#E3D5C4;
  --ink:#2B1A12;--ink-2:#6B5548;--ink-3:#A08A7B;
  --accent:#93412A;--accent-ink:#FFF8F0;--accent-soft:#F3DDD2;
  --ok:#3D7A4F;--ok-soft:#DFEEDF;--fix:#C4831B;--fix-soft:#F9E8CB;--urg:#B8322A;--urg-soft:#F6D9D4;
  --shadow:0 1px 2px rgba(22,32,42,.05),0 8px 24px rgba(22,32,42,.06);
  --r:18px;
  --fd:"Cormorant Garamond",Georgia,serif;--fb:"Jost",system-ui,sans-serif;--fs:15px;
  --pole:#93412A;--pole-soft:#F3DDD2;--pole-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1A1411;--surface:#241C18;--surface-2:#31261F;--line:#42342C;
  --ink:#F4ECE4;--ink-2:#C2B0A2;--ink-3:#8C7A6C;
  --accent:#D8846A;--accent-ink:#1A1411;--accent-soft:#4A2E24;
  --ok:#5BC48A;--ok-soft:#1B3A2A;--fix:#E8A045;--fix-soft:#3E2E15;--urg:#E8635A;--urg-soft:#44201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A1411;--surface:#241C18;--surface-2:#31261F;--line:#42342C;
  --ink:#F4ECE4;--ink-2:#C2B0A2;--ink-3:#8C7A6C;
  --accent:#D8846A;--accent-ink:#1A1411;--accent-soft:#4A2E24;
  --ok:#5BC48A;--ok-soft:#1B3A2A;--fix:#E8A045;--fix-soft:#3E2E15;--urg:#E8635A;--urg-soft:#44201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);margin:0;text-wrap:pretty;letter-spacing:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pole);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:56px}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-3)}
img{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}.brand .mark img{width:100%;height:100%;display:block}
.brand h1{font-size:20px;font-weight:700;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:500;line-height:1.1;font-family:var(--fb)}
.spacer{flex:1}
.daterow{display:flex;align-items:center;gap:4px}
.daterow input[type=date]{padding:7px 10px;font-weight:600;font-family:var(--fd);border-radius:10px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.sync{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on::before{background:var(--ok)}.sync.saving::before{background:var(--fix)}
.hdrR{display:flex;align-items:center;gap:8px}
@media(max-width:640px){.brand>span:last-child{display:none}.sync span{display:none}.top-in{padding:8px 12px;gap:8px}.daterow input[type=date]{width:100%}.daterow{flex:1}}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:18px}
@media(max-width:700px){body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}.wrap{padding-top:14px;gap:14px}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;padding:6px 0 4px}
.hero .day{font-family:var(--fd);font-weight:600;font-size:104px;line-height:.8;letter-spacing:-.03em;color:var(--accent)}
.hero .dmeta{display:grid;gap:2px;padding-bottom:6px}
.hero .dmeta h2{font-size:34px;font-weight:600;line-height:1;font-style:italic}
.hero .dmeta .wk{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.hero .dmeta p{margin:6px 0 0;color:var(--ink-2);max-width:48ch}
.stats{display:flex;gap:0;background:var(--ink);color:#F6EFE6;border-radius:var(--r);padding:6px;overflow:hidden}
.stat{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:0;border-right:1px solid rgba(255,255,255,.12);min-width:0}
.stat:last-child{border-right:0}
.stat b{font-family:var(--fd);font-size:34px;font-weight:600;line-height:1}
.stat span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500;margin-top:5px}
.stat.urg b{color:#FF8A80}.stat.fix b{color:#FFC97A}.stat.ok b{color:#7FE0A6}
@media(max-width:700px){.hero{grid-template-columns:auto 1fr;gap:4px 14px}.hero .day{font-size:64px}.hero .dmeta h2{font-size:20px}.hero .dmeta p{display:none}.stat{padding:10px 8px}.stat b{font-size:22px}.stat span{font-size:9.5px}}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--urg);color:#fff;font-weight:600;font-size:13.5px}
.alert.warn{background:var(--fix);color:#fff}
.alert button{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.2);white-space:nowrap}
.sec-title{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.sec-title h3{font-size:24px;font-weight:600;font-style:italic}
.sec-title span{font-size:12.5px;color:var(--ink-3)}
.poles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.poles{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.poles{grid-template-columns:1fr 1fr;gap:8px}}
.pcard{--pole:#0E7C86;background:var(--pole);color:#fff;border-radius:var(--r);padding:16px;display:grid;grid-template-rows:auto 1fr auto;gap:14px;text-align:left;position:relative;overflow:hidden;min-height:170px;transition:transform .15s,filter .15s;box-shadow:0 10px 30px color-mix(in srgb,var(--pole) 25%,transparent)}
.pcard:hover{transform:translateY(-3px);filter:brightness(1.05)}
.pcard::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.pcard .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.pcard .ic svg{width:22px;height:22px}
.pcard .ring{width:46px;height:46px;flex:none}
.pcard .ring circle{fill:none;stroke-width:5}
.pcard .ring .bg{stroke:rgba(255,255,255,.2)}
.pcard .ring .fg{stroke:#fff;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.pcard .ring text{fill:#fff;font-family:var(--fb);font-weight:600;font-size:11px}
.pcard h3{font-size:24px;font-weight:600;line-height:1;color:#fff;align-self:end}
.pcard .sub{display:none}
.pcard .chips{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.pcard .chip{background:rgba(255,255,255,.18);color:#fff}
.pcard .chip.urg{background:#fff;color:var(--urg)}.pcard .chip.fix{background:rgba(255,255,255,.9);color:var(--fix)}.pcard .chip.ok{background:rgba(255,255,255,.9);color:var(--ok)}
.pcard.done{outline:3px solid var(--ok);outline-offset:-3px}
.pcard.ani{color:#3A2A00}.pcard.ani h3,.pcard.ani .chip,.pcard.ani .ring text{color:#3A2A00;fill:#3A2A00}.pcard.ani .ring .fg{stroke:#3A2A00}.pcard.ani .ic{background:rgba(0,0,0,.1)}.pcard.ani .chip{background:rgba(0,0,0,.1)}
.pcard::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.25);border-radius:calc(var(--r) - 8px);pointer-events:none}
@media(max-width:700px){.pcard{padding:12px;min-height:150px;gap:10px}.pcard h3{font-size:16px}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.fix{background:var(--fix-soft);color:var(--fix)}.chip.urg{background:var(--urg-soft);color:var(--urg)}.chip.pole{background:var(--pole-soft);color:var(--pole)}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .fix{background:var(--fix)}.bar .urg{background:var(--urg)}.bar .pole{background:var(--pole)}
.flow{display:flex;gap:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.fstep{flex:1 1 160px;padding:14px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px}
.fstep:hover{background:var(--surface-2)}
.fstep .k{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink-2)}
.fstep .t{font-weight:600;font-size:14px;font-family:var(--fb)}
.fstep .s{font-size:12px;color:var(--ink-3)}
.fstep.done .k{background:var(--ok);color:#fff}.fstep.done .s{color:var(--ok)}
.fstep.warn .k{background:var(--fix);color:#fff}.fstep.warn .s{color:var(--fix)}
.fstep.next{background:var(--accent-soft)}.fstep.next .k{background:var(--ink);color:#fff}

/* ---------- pole screen ---------- */
.phead{background:var(--pole);color:var(--pole-ink);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.phead .back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:inherit;position:relative;z-index:1}
.phead .back:hover{background:rgba(255,255,255,.28)}
.phead h2{font-size:32px;font-weight:600;position:relative;z-index:1;color:#fff;line-height:1}
.phead .d{font-size:13px;opacity:.9;position:relative;z-index:1}
.phead .pk{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}
.phead .pk span{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:700px){.phead{grid-template-columns:auto 1fr;padding:14px}.phead h2{font-size:19px}.phead .pk{grid-column:1/3;justify-content:flex-start}}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.subtabs button{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;font-family:var(--fb);color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.subtabs button .n{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.subtabs button[aria-selected=true]{background:var(--pole);color:var(--pole-ink);border-color:var(--pole)}
.subtabs button[aria-selected=true] .n{background:rgba(255,255,255,.22);color:inherit}
.subtabs button .dot{width:7px;height:7px;border-radius:50%;background:var(--urg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:160px;border-radius:999px;padding:8px 14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.pill[aria-pressed=true]{border-color:currentColor}
.pill.ok{color:var(--ok)}.pill.fix{color:var(--fix)}.pill.urg{color:var(--urg)}
.pill[aria-pressed=true].ok{background:var(--ok-soft)}.pill[aria-pressed=true].fix{background:var(--fix-soft)}.pill[aria-pressed=true].urg{background:var(--urg-soft)}
.pill.solid{background:var(--pole);color:var(--pole-ink);border-color:var(--pole)}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.zone>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.zone>header:hover{background:var(--surface-2)}
.zone>header .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pole);background:var(--pole-soft);padding:3px 7px;border-radius:6px;white-space:nowrap}
.zone>header h3{font-size:19px;font-weight:600;flex:1;min-width:0}
.zone>header .zn{font-size:12.5px;color:var(--ink-2);font-weight:600}
.zone>header .zn.done{color:var(--ok)}
.zone>header .allok{font-size:12px;font-weight:700;color:var(--ok);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.zone>header .allok:hover{background:var(--ok-soft)}
.zone>header .fold{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.zone>header .strip{position:absolute;left:0;right:0;bottom:-1px;height:3px;display:flex}
.zone>header .strip i{display:block;height:100%}
.zone>header .strip .ok{background:var(--ok)}.zone>header .strip .fix{background:var(--fix)}.zone>header .strip .urg{background:var(--urg)}
.zone.closed .items{display:none}
.zone.closed .fold svg{transform:rotate(-90deg)}
.items{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding:10px 12px 10px 14px;display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;border-left:4px solid transparent}
.item:first-child{border-top:0}
.item.s-ok{border-left-color:var(--ok)}.item.s-fix{border-left-color:var(--fix);background:color-mix(in srgb,var(--fix-soft) 40%,transparent)}.item.s-urg{border-left-color:var(--urg);background:color-mix(in srgb,var(--urg-soft) 45%,transparent)}.item.s-na{opacity:.6}
.item .txt{min-width:0;font-size:14.5px;font-weight:500}
.item.s-ok .txt{color:var(--ink-2);font-weight:400}
.item .txt .cid{font-size:11px;color:var(--ink-3);font-weight:600;margin-right:6px}
.item .txt .ztag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.item .txt .q{display:block;font-size:11px;font-weight:700;color:var(--pole);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.item .meta{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px;font-weight:400}
.item .meta .obs{font-style:italic}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{padding:8px 12px;font-size:12.5px;font-weight:600;font-family:var(--fb);color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button.ok[aria-pressed=true]{background:var(--ok);color:#fff}
.seg button.fix[aria-pressed=true]{background:var(--fix);color:#fff}
.seg button.urg[aria-pressed=true]{background:var(--urg);color:#fff}
.seg button.na[aria-pressed=true]{background:var(--ink-3);color:#fff}
.detail{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.detail:hover{background:var(--surface-2);color:var(--ink)}
.detail.has{color:var(--pole)}.detail.on{background:var(--pole-soft);color:var(--pole)}
.more{grid-column:1/4;display:grid;grid-template-columns:110px 1fr 140px auto;gap:8px;padding:12px;background:var(--surface-2);border-radius:10px}
.more .full{grid-column:1/-1}
.more label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-2);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.more label.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-weight:500;font-size:13px;padding-top:18px}
.more input[type=checkbox]{width:18px;height:18px;accent-color:var(--pole)}
@media(max-width:700px){.item{grid-template-columns:1fr auto;padding:10px 10px 10px 12px}.item .seg{grid-column:1;display:flex;width:100%}.item .seg button{flex:1;padding:11px 4px}.item .detail{grid-column:2;grid-row:2;width:40px;height:42px}.more{grid-column:1/3;grid-template-columns:1fr 1fr}.more .full{grid-column:1/3}}
.empty{padding:28px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.photo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photo .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.photo .pbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;background:var(--pole);color:var(--pole-ink);font-size:12.5px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;text-transform:none;letter-spacing:0}
.photo .pbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo .pbtn.busy{opacity:.6;pointer-events:none}
.photo input[type=url]{flex:1;min-width:140px}
.photo .prm{font-size:12px;color:var(--urg);font-weight:700}
.pinfo{font-size:12px;color:var(--ink-3);font-style:italic}
.mthumb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:10px}

/* ---------- cards & forms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card h3{font-size:20px;font-weight:600}
.card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .ch h3{flex:1}
.addbtn{font-size:13px;font-weight:600;font-family:var(--fb);padding:10px 16px;border-radius:999px;background:var(--ink);color:#F6EFE6;white-space:nowrap;letter-spacing:.02em}
.addbtn.ghost{background:var(--surface);color:var(--pole);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-2);font-weight:700;letter-spacing:.04em;text-transform:uppercase;grid-column:span 4;min-width:0}
.fields label.s{grid-column:span 2}.fields label.m{grid-column:span 3}.fields label.h{grid-column:span 6}.fields label.wide{grid-column:1/-1}
.fields label.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-weight:500;font-size:13.5px;align-self:end;padding-bottom:8px;grid-column:span 3}

.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 40px 12px 14px;position:relative;border-left:4px solid var(--line);box-shadow:var(--shadow)}

select.st{font-weight:700}select.st.v-ok{color:var(--ok)}select.st.v-fix{color:var(--fix)}select.st.v-urg{color:var(--urg)}

.kpi small{font-size:12px;color:var(--ink-3)}

button.kpi[aria-pressed=true]{outline:2px solid var(--pole);outline-offset:-2px}

.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap}

function flush(){
  if(!db)return;const jobs=[];const stamp=o=>{o.updatedAt=new Date().toISOString();return o};
  if(dirty){dirty=false;const d=day,body=stamp(JSON.parse(JSON.stringify(state)));body.date=d;jobs.push(()=>db.doc('jours/jour-'+d).set(body))}
  if(dirtyWeek){dirtyWeek=false;const wk=curWeek,body=stamp(JSON.parse(JSON.stringify(week)));body.week=wk;jobs.push(()=>db.doc('semaines/'+wk).set(body))}
  if(dirtySuivi){dirtySuivi=false;jobs.push(()=>db.doc('suivi/actions').set(stamp(JSON.parse(JSON.stringify(suivi)))))}
  if(dirtyTeam){dirtyTeam=false;jobs.push(()=>db.doc('equipe/liste').set(stamp(JSON.parse(JSON.stringify(team)))))}
  if(dirtyClients){dirtyClients=false;jobs.push(()=>db.doc('clients/liste').set(stamp(JSON.parse(JSON.stringify(clients)))))}
  if(!jobs.length)return;
  writing=writing.then(()=>Promise.all(jobs.map(j=>j()))).then(()=>{if(!dirty&&!dirtyWeek&&!dirtySuivi&&!dirtyTeam&&!dirtyClients)setSync('on','Synchronisé')}).catch(e=>{console.warn(e);setSync('','Hors ligne (local)')});
}

function stats(items){let ok=0,fix=0,urg=0,na=0,rc=0;for(const k in items){const it=items[k];if(it.s==='ok')ok++;else if(it.s==='fix')fix++;else if(it.s==='urg')urg++;else if(it.s==='na')na++;if(it.rc)rc++}return {ok,fix,urg,na,rc,done:ok+fix+urg+na}}
function zoneState(k,zi){const c=CL[k],items=itemsOf(k),base=c.base[zi],n=c.sections[zi][1].length;let ok=0,fix=0,urg=0,na=0;for(let i=0;i<n;i++){const it=items[base+i];if(!it)continue;if(it.s==='ok')ok++;else if(it.s==='fix')fix++;else if(it.s==='urg')urg++;else if(it.s==='na')na++}return {base,ok,fix,urg,na,n,done:ok+fix+urg+na}}
function poleStats(k,p){const c=CL[k],items=itemsOf(k);const t={ok:0,fix:0,urg:0,na:0,n:0,done:0};c.sections.forEach((sec,zi)=>{sec[1].forEach((_,i)=>{if(p&&itemPole(k,zi,i)!==p)return;t.n++;const it=items[c.base[zi]+i];if(!it||!it.s)return;t[it.s]++;t.done++})});return t}
function sumStats(list){return list.reduce((a,t)=>{for(const q in t)a[q]=(a[q]||0)+t[q];return a},{})}
function verdictOf(k,st,total){const c=CL[k],left=total-st.done,w=c.word;
  if(!st.done)return ['none','Aucun point contrôlé.'];
  if(left)return ['fix',`À compléter — ${left} point${left>1?'s':''} restant${left>1?'s':''}${st.urg?` · ${st.urg} critique${st.urg>1?'s':''} signalé${st.urg>1?'s':''}`:''}.`];
  if(st.urg)return ['urg',`Blocage critique — ${st.urg} anomalie${st.urg>1?'s':''} critique${st.urg>1?'s':''}. Inès doit être alertée.`];
  if(st.fix)return ['fix',`${w} avec anomalies — ${st.fix} point${st.fix>1?'s':''} à traiter.`];
  return ['ok',`${w} conforme — tous les points sont validés.`]}

/* ---------- POLE ---------- */
function renderPole(){
  const p=POLE[view.id];const subs=subsFor(p.id);
  const gp=p.id==='dir'?null:p.id;const o=sumStats([poleStats('open',gp),poleStats('assia',gp)]);const f=poleStats('ferm',gp);const w=poleStats('hebdo',gp);
  const acts=suivi.rows.filter(r=>r.st!=='done'&&(!gp||actPole(r)===gp)).length;
  const counts={ouv:`${o.done}/${o.n}`,ferm:`${f.done}/${f.n}`,hebdo:`${w.done}/${w.n}`,actions:acts||'',clients:state.regs.client.length||'',stock:state.regs.stock.length||'',tech:state.regs.tech.filter(r=>!r.rc).length||'',brief:state.regs.brief.length||'',journee:state.regs.ctrl.length||''};
  const dots={ouv:o.urg,ferm:f.urg,hebdo:w.urg,tech:state.regs.tech.some(r=>r.grav==='urg'&&!r.rc)};
  const global=p.id==='dir';

  switch(view.sub){
    case 'ouv':body=renderChecklists(['open','assia'],global?null:p.id);break;
    case 'ferm':body=renderChecklists(['ferm'],global?null:p.id);break;

    case 'equipe':body=renderEquipe(global?null:p.id);break;
    case 'actions':body=renderSuivi(global?null:p.id);break;

    case 'stock':body=renderReg('stock');break;
    case 'tech':body=renderReg('tech');break;

      <div><h2>${p.name}</h2><div class="d">${global?'Vue d\'ensemble de tous les pôles · '+weekLabel(day):p.desc}</div></div>

    ${body}`;

/* ---------- checklists rendering ---------- */
function renderChecklists(keys,pid){
  const st=sumStats(keys.map(k=>poleStats(k,pid)));const first=CL[keys[0]];
  const total=st.n;const na=keys.some(k=>CL[k].na);
  const tools=`<div class="toolbar"><input type="search" id="q" placeholder="Rechercher…" value="${esc(query)}" aria-label="Rechercher">
    <button class="pill fix" data-filter="fix" aria-pressed="${filter==='fix'}">${first.labels.fix} <b class="num">${st.fix}</b></button>
    <button class="pill urg" data-filter="urg" aria-pressed="${filter==='urg'}">${first.labels.urg} <b class="num">${st.urg}</b></button>
    <button class="pill" data-filter="todo" aria-pressed="${filter==='todo'}">Restants <b class="num">${total-st.done}</b></button>
    ${pid?'':'<button class="pill" data-help>Règles</button>'}</div>
    <div class="bar"><i class="ok" style="width:${st.ok/total*100}%"></i><i class="fix" style="width:${st.fix/total*100}%"></i><i class="urg" style="width:${st.urg/total*100}%"></i></div>`;
  let zones='';const q=query.toLowerCase();
  const order=pid?[pid]:POLES.map(p=>p.id);
  for(const k of keys){const c=CL[k];const items=itemsOf(k);
    if(k==='ferm'){
      for(const pp of order){
        const rows=[];c.sections[0][1].forEach((it,i)=>{if(itemPole(k,0,i)!==pp)return;const gi=i;if(!matches(items[gi],it[1]+' '+it[0]+' '+it[2],q))return;rows.push(itemHtml(k,gi,it[1],it[0],it[2]))});
        if(!rows.length)continue;
        const z=poleStats('ferm',pp);const key=k+':'+pp;const closed=!(open.has(key)||q||filter||pid);
        zones+=zoneHtml(key,POLE[pp].short,'Fermeture',z,rows,closed,`data-allok="${k}:p:${pp}"`);
      }
      continue;
    }
    c.sections.forEach((sec,zi)=>{
      if(pid&&c.zp[zi]!==pid)return;
      const rows=[];sec[1].forEach((_,i)=>{const gi=c.base[zi]+i;const t=itemText(k,zi,i),id=itemId(k,zi,i);if(!matches(items[gi],t+' '+id,q))return;rows.push(itemHtml(k,gi,t,id,''))});
      if(!rows.length)return;
      const z=zoneState(k,zi);const key=k+':'+zi;const closed=!(open.has(key)||q||filter||(pid&&keys.length===1&&c.sections.filter((s,j)=>c.zp[j]===pid).length===1));
      zones+=zoneHtml(key,nice(sec[0]),k==='open'?'Ouverture':k==='assia'?'Parcours client':'Hebdo',z,rows,closed,`data-allok="${k}:${zi}"`);
    });
    if(!pid)zones='';
  }
  if(!pid){ // global view: group by pôle
    zones='';
    for(const pp of order){let inner='';
      for(const k of keys){const c=CL[k];const items=itemsOf(k);
        if(k==='ferm'){const rows=[];c.sections[0][1].forEach((it,i)=>{if(itemPole(k,0,i)!==pp)return;if(!matches(items[i],it[1]+' '+it[0]+' '+it[2],q))return;rows.push(itemHtml(k,i,it[1],it[0],it[2]))});if(rows.length){const z=poleStats('ferm',pp);const key=k+':'+pp;inner+=zoneHtml(key,POLE[pp].short,'Fermeture',z,rows,!(open.has(key)||q||filter),`data-allok="${k}:p:${pp}"`)}continue}
        c.sections.forEach((sec,zi)=>{if(c.zp[zi]!==pp)return;const rows=[];sec[1].forEach((_,i)=>{const gi=c.base[zi]+i;const t=itemText(k,zi,i),id=itemId(k,zi,i);if(!matches(items[gi],t+' '+id,q))return;rows.push(itemHtml(k,gi,t,id,''))});if(!rows.length)return;const z=zoneState(k,zi);const key=k+':'+zi;inner+=zoneHtml(key,nice(sec[0]),k==='open'?'Ouverture':k==='assia'?'Parcours client':'Hebdo',z,rows,!(open.has(key)||q||filter),`data-allok="${k}:${zi}"`)});
      }
      if(inner)zones+=`<div class="sec-title" style="margin-top:6px"><h3 style="color:${POLE[pp].color}">${POLE[pp].name}</h3></div>${inner}`;
    }
  }
  const [vc,vt]=keys.length===1?verdictOf(keys[0],st,total):verdictOf('open',st,total);
  return `${tools}${$('#help')&&!$('#help').hidden?helpHtml():'<div id="help" hidden></div>'}<div style="display:grid;gap:12px">${zones||'<div class="empty">Aucun point ne correspond.</div>'}</div>
    <div class="verdict ${vc}">${vt}</div>`;
}
function helpHtml(){return `<div class="help" id="help"><h4 style="font-size:13px">Règles de contrôle</h4><dl><dt style="color:var(--ok)">Conforme / OK</dt><dd>Le point répond au niveau attendu.</dd><dt style="color:var(--fix)">Non conforme / À corriger</dt><dd>Un écart est constaté : action, responsable et échéance obligatoires.</dd><dt style="color:var(--urg)">Critique / Urgent</dt><dd>L'anomalie compromet la sécurité, l'accueil ou l'ouverture d'une zone. Inès doit être alertée immédiatement.</dd><dt>Non applicable</dt><dd>Le contrôle ne s'applique pas ce jour-là.</dd></dl><p class="note" style="margin:0">Rapport d'ouverture envoyé avant les premières clientes ; rapport de clôture après la fermeture avec le bilan et les actions ouvertes.</p></div>`}
function matches(it,text,q){if(q&&!text.toLowerCase().includes(q))return false;if(!filter)return true;const s=it?.s;if(filter==='todo')return !s;return s===filter}
function zoneHtml(key,title,tag,z,rows,closed,allokAttr){
  return `<section class="zone ${closed?'closed':''}" data-zkey="${key}"><header data-fold="${key}"><span class="tag">${tag}</span><h3>${esc(title)}</h3>
    <span class="zn num ${z.done===z.n?'done':''}">${z.done===z.n?'✓ ':''}${z.done}/${z.n}</span>${z.done<z.n?`<button class="allok" ${allokAttr}>Tout OK</button>`:''}
    <button class="fold" aria-label="Déplier"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5l4 4 4-4"/></svg></button>
    <span class="strip"><i class="ok" style="width:${z.ok/z.n*100}%"></i><i class="fix" style="width:${z.fix/z.n*100}%"></i><i class="urg" style="width:${z.urg/z.n*100}%"></i></span></header>
    <div class="items">${rows.join('')}</div></section>`;
}
function itemHtml(k,gi,text,cid,ztag){
  const c=CL[k],it=itemsOf(k)[gi]||{};const dk=k+':'+gi;
  const isQ=text.startsWith('QUESTION DIRECTION');

  const meta=[];if(it.h)meta.push(`<span>⏱ ${esc(it.h)}</span>`);if(it.r)meta.push(`<span>→ ${esc(it.r)}</span>`);if(it.a)meta.push(`<span>⚡ ${esc(it.a)}</span>`);if(it.due)meta.push(`<span>📅 ${esc(fmtDate(it.due))}</span>`);if(it.rc)meta.push('<span>✓ recontrôlé</span>');if(it.photo)meta.push(photoThumb(it,'mthumb'));if(it.link)meta.push(`<a href="${esc(it.link)}" target="_blank" rel="noopener" style="color:var(--pole)">📎 lien</a>`);if(it.o)meta.push(`<span class="obs">${esc(it.o)}</span>`);
  const has=it.h||it.r||it.o||it.rc||it.a||it.due||it.link||it.photo;
  return `<div class="item s-${it.s||'none'}" data-k="${k}" data-gi="${gi}">
    <div class="txt">${label}${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>
    <div class="seg" role="group"><button class="ok" data-s="ok" aria-pressed="${it.s==='ok'}">${c.labels.ok}</button><button class="fix" data-s="fix" aria-pressed="${it.s==='fix'}">${c.labels.fix}</button><button class="urg" data-s="urg" aria-pressed="${it.s==='urg'}">${c.labels.urg}</button>${c.na?`<button class="na" data-s="na" aria-pressed="${it.s==='na'}">N/A</button>`:''}</div>
    <button class="detail ${detail.has(dk)?'on':''} ${has?'has':''}" data-toggle="${dk}" aria-label="Détails"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11.5 2.5l2 2L6 12H4v-2z"/><path d="M3 14h10"/></svg></button>
    ${detail.has(dk)?`<div class="more">
      <label>Heure<input type="time" data-f="h" value="${esc(it.h||'')}"></label>
      <label>Responsable<input type="text" data-f="r" list="teamlist" value="${esc(it.r||'')}" placeholder="Qui s'en occupe"></label>
      <label>Échéance<input type="date" data-f="due" value="${esc(it.due||'')}"></label>

      <label class="full">Photo / lien<div class="photo">${photoThumb(it,'thumb')}<span class="pbtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5h2.5l1-2h5l1 2H14v8H2z"/><circle cx="8" cy="9" r="2.5"/></svg><span>${it.photo?'Remplacer la photo':'Prendre / choisir une photo'}</span><input type="file" accept="image/*" capture="environment" data-photo="${dk}"></span>${it.photo?`<button type="button" class="prm" data-prm="${dk}">Retirer</button>`:''}<input type="url" data-f="link" value="${esc(it.link||'')}" placeholder="ou coller un lien https://…"></div></label>
    </div>`:''}</div>`;
}
function setStatus(k,gi,s){const it=item(k,gi),items=itemsOf(k);if(it.s===s)delete it.s;else{it.s=s;if((s==='fix'||s==='urg')&&!it.h)it.h=new Date().toTimeString().slice(0,5)}if(it.s==='fix'||it.s==='urg')detail.add(k+':'+gi);if(!Object.keys(it).length)delete items[gi];persistCL(k);render()}

/* ---------- rapports (synthèses) ---------- */

  return ['open','assia','ferm','hebdo'].map(k=>{const c=CL[k],st=poleStats(k),s=synthOf(k);const [vc,vt]=verdictOf(k,st,st.n);
    return `<div class="card" data-rep="${k}"><div class="ch"><h3>${c.title}${k==='hebdo'?' — '+weekLabel(day):''}</h3><span class="chip ${vc==='none'?'':vc}">${st.done}/${st.n}</span></div>

      <div class="fields">${c.fields.map(f=>`<label class="m">${f[1]}<input type="${f[2]}" data-sf="${f[0]}" value="${esc(s[f[0]]||'')}" ${f[3]?`placeholder="${esc(f[3])}"`:''} ${f[2]==='text'?'list="teamlist"':''}></label>`).join('')}<label class="wide">Notes<textarea data-sf="notes" placeholder="Observations, points à suivre…">${esc(s.notes||'')}</textarea></label></div>
      <div class="confirm" data-resetrow="${k}"><button data-reset="${k}">Réinitialiser cette checklist</button></div></div>`}).join('');
}

/* ---------- registres ---------- */

function fieldHtml(c,r){

const num=v=>v===''||v===undefined||v===null||isNaN(+v)?null:+v;

function caRow(r){const brut=num(r.brut),rem=num(r.rem)||0,remb=num(r.remb)||0;const net=brut===null&&num(r.rem)===null&&num(r.remb)===null?null:(brut||0)-rem-remb;const e=num(r.esp),c=num(r.carte),a=num(r.aut);const enc=e===null&&c===null&&a===null?null:(e||0)+(c||0)+(a||0);const ecart=enc===null?null:enc-(net||0);return {net,ecart}}

function renderBilan(){

  const enc=(tot.esp||0)+(tot.carte||0)+(tot.aut||0);const hasEnc=tot.esp!==undefined||tot.carte!==undefined||tot.aut!==undefined;const ec=tot.ecart;const ecCls=ec===undefined?'':Math.abs(ec)>0.005?'urg':'ok';

  const secDone=(key,cols)=>{const o=B[key]||{};return cols.some(c=>c[2]!=='hint'&&o[c[0]]!==undefined&&o[c[0]]!=='')};
  const secs=BILAN_SECTIONS.map(([key,title,cols])=>`<div class="card" data-bs="${key}"><div class="ch"><h3>${title}</h3><span class="chip ${secDone(key,cols)?'ok':''}">${secDone(key,cols)?'✓ renseigné':'à renseigner'}</span></div><div class="fields">${cols.map(c=>{const [k,lbl,type,extra,wide]=c;const o=B[key]||{};const v=o[k]??'';
    if(type==='hint'){const rc=state.regs.client;const n1=rc.filter(r=>r.type==='recl'||r.type==='avis').length,n2=rc.filter(r=>r.type==='comp').length;return `<label class="h">${lbl}<span class="calc">${n1} réclamation${n1>1?'s':''} · ${n2} compliment${n2>1?'s':''}</span></label>`}
    const cls=wide?'wide':(type==='number'||type==='select')?'m':'h';
    if(type==='textarea')return `<label class="${cls}">${lbl}<textarea data-k="${k}">${esc(v)}</textarea></label>`;
    if(type==='select')return `<label class="${cls}">${lbl}<select data-k="${k}">${extra.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></label>`;
    return `<label class="${cls}">${lbl}<input type="${type}" data-k="${k}" value="${esc(v)}" ${type==='number'?'inputmode="numeric"':''}></label>`}).join('')}</div></div>`).join('');
  return `<div class="kpis"><div class="kpi pole"><b class="num">${tot.net!==undefined?fmt(tot.net)+' DH':'—'}</b><span>CA net</span><small>brut ${fmt(tot.brut)} · remises ${fmt(tot.rem)}</small></div><div class="kpi pole"><b class="num">${hasEnc?fmt(enc)+' DH':'—'}</b><span>Encaissé</span><small>esp. ${fmt(tot.esp)} · carte ${fmt(tot.carte)}</small></div><div class="kpi ${ecCls}"><b class="num">${ec!==undefined?(ec>0?'+':'')+fmt(ec)+' DH':'—'}</b><span>Écart</span><small>${ec===undefined?'à saisir':Math.abs(ec)>0.005?'à justifier':'caisse équilibrée'}</small></div><div class="kpi"><b class="num">${fmt(tot.pass)}</b><span>Passages</span><small>${tot.prest!==undefined?fmt(tot.prest)+' prestations':'—'}</small></div></div>
    <div class="card" id="bilanCA"><div class="ch"><h3>1. Activité et chiffre d'affaires par secteur</h3><span class="chip ${tot.net!==undefined?'ok':''}">${tot.net!==undefined?'✓ renseigné':'à renseigner'}</span></div><div class="tblwrap"><table class="ca">${thead}<tbody>${trs}${totRow}</tbody></table></div><p class="note" style="margin:0">CA net = brut − remises − remboursements. Écart = (espèces + carte + autres) − CA net.</p></div>
    ${secs}
    <div class="card"><div class="ch"><h3>Envoi à Inès</h3><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600">Heure d'envoi <input type="time" id="bilanSent" value="${esc(B.sent||'')}"></label><span class="chip ${B.sent?'ok':''}">${B.sent?'✓ Envoyé à '+B.sent:'Bilan à compléter'}</span></div></div>`;
}

/* ---------- photos ---------- */
function photoSrc(p){if(!p)return null;if(p.id)return '/_blob/'+p.id;if(p.local)return photos[p.local]||null;return null}
function photoThumb(it,cls){if(!it.photo)return '';const src=photoSrc(it.photo);if(!src)return '<span class="pinfo">photo sur un autre appareil</span>';return `<img class="${cls}" src="${src}" alt="Photo" data-lb="1">`}
function shrink(file,max=1200,q=.78){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}
async function addPhoto(k,gi,file){const it=item(k,gi);let blob;try{blob=await shrink(file)}catch(e){blob=file}
  if(assets){try{const r=await assets.upload(blob,{type:'image/jpeg'});it.photo={id:r.id};persistCL(k);render();return}catch(e){console.warn('upload',e)}}
  const key=day+':'+k+':'+gi+':'+uid();const dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});photos[key]=dataUrl;
  try{localStorage.setItem('ava-photos',JSON.stringify(photos))}catch(e){setSync('','Mémoire photos pleine');return render()}
  it.photo={local:key};persistCL(k);render()}

  if(D.importTech){const [k,g]=D.importTech.split(':'),gi=+g,it=itemsOf(k)[gi],[zi,i]=locate(k,gi);state.regs.tech.push({id:uid(),src:D.importTech,h:it.h||'',zone:nice(CL[k].sections[zi][0]),pb:itemText(k,zi,i)+(it.o?' — '+it.o:''),grav:it.s,tech:it.r||'',action:it.a||'',rc:'',photo:it.photo||null});persist();render();return}

  if(D.importact){const [c,g]=D.importact.split(':'),gi=+g,it=itemsOf(c)[gi],[zi,i]=locate(c,gi);const r={id:uid(),n:nextN(day),date:day,srcKey:(c==='hebdo'?curWeek:day)+':'+c+':'+gi,src:c,crit:it.s,pole:itemPole(c,zi,i),zone:nice(CL[c].sections[zi][0]),pb:itemText(c,zi,i)+(it.o?' — '+it.o:''),act:it.a||'',resp:it.r||'',due:it.due||'',st:'todo',photo:it.photo||null};suivi.rows.push(r);suiviOpen.add(r.id);persistSuivi();render();return}
  if(D.closeact){suiviOpen.delete(D.closeact);render();return}

  if(D.addclient!==undefined){clients.rows.unshift({id:uid(),nom:'',tel:'',email:'',pref:'',notes:'',vip:false});persistClients();render();const f=V.querySelector('.cc input');f&&f.focus();return}

/* ---------- boot ---------- */
function start(snap){
  if(snap&&snap.day){day=snap.day;state=snap.state?norm(snap.state):state;view=snap.view||view;if(snap.suivi)suivi=snap.suivi;if(snap.team)team=snap.team;if(snap.clients)clients=snap.clients}
  if(!snap||!snap.state)state=loadLocal(day)||blank();
  if(!snap||!snap.suivi){try{const j=localStorage.getItem('ava-suivi');if(j)suivi=JSON.parse(j)}catch(e){}}
  if(!snap||!snap.team){try{const j=localStorage.getItem('ava-team');if(j)team=JSON.parse(j)}catch(e){}}
  if(!snap||!snap.clients){try{const j=localStorage.getItem('ava-clients');if(j)clients=JSON.parse(j)}catch(e){}}
  loadWeek();render();
  window.claude?.hot?.snapshot?.(()=>({day,state,view,suivi,team,clients}));
  window.claude?.use?.('db').then(d=>{if(!d)return;db=d;subscribeDay();subscribeGlobals();curWeek='';loadWeek()}).catch(()=>{});
  window.claude?.use?.('assets').then(a=>{assets=a}).catch(()=>{});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data);
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
